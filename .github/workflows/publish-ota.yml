name: Publish OTA

# Dispara automaticamente quando codigo do app muda.
# Tambem pode ser rodado manualmente via Actions → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'mobile/**'
      - 'scripts/build-mobile.mjs'
      - 'scripts/publish-mobile.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  publish-ota:
    name: Build e publica bundle OTA
    runs-on: [self-hosted, gioc]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checar se mudancas exigem novo APK
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          NATIVE_PATTERNS="mobile/android/ mobile/ios/ mobile/capacitor.config.ts mobile/package.json"
          NEEDS_APK=""
          for pattern in $NATIVE_PATTERNS; do
            if echo "$CHANGED" | grep -q "$pattern"; then
              NEEDS_APK="$NEEDS_APK\n- \`$pattern\`"
            fi
          done
          if [ -n "$NEEDS_APK" ]; then
            echo "## ⚠️ ATENÇÃO: novo APK necessário" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Arquivos nativos alterados neste push:" >> $GITHUB_STEP_SUMMARY
            printf "$NEEDS_APK" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "O bundle OTA **não atualiza código nativo**. É preciso:" >> $GITHUB_STEP_SUMMARY
            echo "1. \`npm run apk\` para gerar o novo APK" >> $GITHUB_STEP_SUMMARY
            echo "2. Distribuir o APK manualmente para os técnicos" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Mudancas nativas detectadas — distribuir novo APK para os tecnicos"
          else
            echo "## ✅ Apenas mudancas de bundle — OTA suficiente" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build + gerar bundle OTA
        run: npm run publish:mobile
        env:
          OTA_PUBLIC_BASE: https://vistomap.nansen.com.br/ota
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      - name: Deploy bundle para o servidor
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('dist-ota/latest.json'))['version'])")
          echo "Publicando versao $VERSION..."
          cp dist-ota/${VERSION}.zip /data/vistomap/ota/bundles/
          cp dist-ota/latest.json /data/vistomap/ota/latest.json
          echo "Deploy concluido:"
          ls -lh /data/vistomap/ota/bundles/${VERSION}.zip
          cat /data/vistomap/ota/latest.json
