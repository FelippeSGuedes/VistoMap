name: Auto Deploy VPS

on:
  push:
    branches:
      - main

# Serializa TODO workflow que roda no runner gioc: nunca dois em paralelo
# (dois builds Next.js concorrentes estouravam a RAM e o deploy falhava).
concurrency:
  group: gioc-runner
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on company server
    runs-on: [self-hosted, gioc]
    # Hard cap: sem isso, um job travado (rede, GitHub, o que for) prende o
    # grupo de concurrency "gioc-runner" para sempre — e o deploy do painel
    # (este workflow) fica bloqueado até alguém cancelar manualmente. Foi
    # exatamente o que aconteceu 2026-07-02→07-06 (4 dias sem deploy real).
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose (GIOC)
        run: |
          docker compose -f docker-compose.gioc.yml --env-file /etc/vistomap/.env.local down --remove-orphans || true
          docker compose -f docker-compose.gioc.yml --env-file /etc/vistomap/.env.local build
          docker compose -f docker-compose.gioc.yml --env-file /etc/vistomap/.env.local up -d --force-recreate
          docker ps --format "{{.Names}}: {{.Status}}"

      - name: Deploy nginx config
        run: |
          CERT=/etc/letsencrypt/live/vistomap.nansen.com.br/fullchain.pem
          if [ -f "$CERT" ]; then
            SRC=scripts/nginx-https.conf
            echo "Nginx: HTTPS config selecionado"
          else
            SRC=scripts/nginx-http.conf
            echo "Nginx: HTTP-only config selecionado (sem TLS ainda)"
          fi
          # scripts/nginx-*.conf tem um placeholder (CHANGE_ME_MATCH_ENV_SECRET) no
          # lugar do secret real do secure_link_md5, de propósito, pra não commitar
          # o valor real no git. Sem essa substituição no deploy, o placeholder
          # (público, visível pra quem lê o repo) ia parar em produção igual ao
          # secret de verdade — auditoria segurança 2026-08 encontrou exatamente
          # isso: assinatura de /uploads/ forjável por qualquer um com leitura do
          # repo, porque um deploy anterior nunca tinha feito essa troca.
          REAL_SECRET=$(sudo grep -oP '^UPLOADS_SECURE_LINK_SECRET=\K.*' /etc/vistomap/.env.local)
          if [ -z "$REAL_SECRET" ]; then
            echo "ERRO: UPLOADS_SECURE_LINK_SECRET não encontrado em /etc/vistomap/.env.local" >&2
            exit 1
          fi
          sed "s/CHANGE_ME_MATCH_ENV_SECRET/${REAL_SECRET}/" "$SRC" | sudo tee /etc/nginx/sites-available/vistomap > /dev/null
          sudo nginx -t
          sudo systemctl reload nginx
          echo "Nginx: config deployed"

      - name: Restart worker (Python systemd)
        run: |
          sudo systemctl restart vistomap-worker
          sleep 2
          sudo systemctl status vistomap-worker --no-pager | head -5
