name: Setup TLS (Let's Encrypt)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email para notificacoes Let's Encrypt"
        required: true
        default: 'felippegustavo1@gmail.com'

jobs:
  setup-tls:
    name: Install TLS certificates
    runs-on: [self-hosted, gioc]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar diretorio ACME webroot
        run: sudo mkdir -p /var/www/certbot

      - name: Certificado vistomap.nansen.com.br
        run: |
          sudo docker run --rm \
            -v /etc/letsencrypt:/etc/letsencrypt \
            -v /var/lib/letsencrypt:/var/lib/letsencrypt \
            -v /var/www/certbot:/var/www/certbot \
            certbot/certbot certonly --webroot \
            -w /var/www/certbot \
            -d vistomap.nansen.com.br \
            --non-interactive --agree-tos -m "${{ github.event.inputs.email }}"

      - name: Certificado gioc.nansen.com.br
        run: |
          sudo docker run --rm \
            -v /etc/letsencrypt:/etc/letsencrypt \
            -v /var/lib/letsencrypt:/var/lib/letsencrypt \
            -v /var/www/certbot:/var/www/certbot \
            certbot/certbot certonly --webroot \
            -w /var/www/certbot \
            -d gioc.nansen.com.br \
            --non-interactive --agree-tos -m "${{ github.event.inputs.email }}"

      - name: Deploy nginx HTTPS e reload
        run: |
          sudo rsync -a scripts/nginx-https.conf /etc/nginx/sites-available/vistomap
          sudo systemctl reload nginx

      - name: Verificar HTTPS
        run: |
          sleep 3
          curl -I --max-time 10 https://vistomap.nansen.com.br/app 2>/dev/null | head -3 || true
          curl -I --max-time 10 https://gioc.nansen.com.br/ 2>/dev/null | head -3 || true

      - name: Configurar renovacao automatica
        run: |
          CRON="0 3 * * * sudo docker run --rm -v /etc/letsencrypt:/etc/letsencrypt -v /var/lib/letsencrypt:/var/lib/letsencrypt -v /var/www/certbot:/var/www/certbot certbot/certbot renew --webroot -w /var/www/certbot --quiet && sudo systemctl reload nginx"
          (crontab -l 2>/dev/null | grep -v certbot; echo "$CRON") | crontab -
          echo "Renovacao configurada (03:00 diario)"
