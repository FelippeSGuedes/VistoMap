# === vistomap.nansen.com.br — App técnico + Painel ===
server {
    listen 80;
    server_name vistomap.nansen.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    client_max_body_size 200M;

    location /uploads/ {
        # Secret PRECISA bater com UPLOADS_SECURE_LINK_SECRET do .env.local
        # deployado — nunca commitar o valor real aqui (auditoria seg 2026-08:
        # antes disso, essa location servia qualquer arquivo pra qualquer um,
        # sem login, só sabendo/adivinhando o nome do equipamento).
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri CHANGE_ME_MATCH_ENV_SECRET";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        alias /data/glpi/plugins/vistomapprojetos/uploads/;
        add_header Cache-Control "private, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    location /files/ {
        # Sem consumidor legítimo (PDF vai por /api/painel/pdf, autenticado,
        # que lê o arquivo direto do disco) — fechado por completo em vez de
        # assinado, auditoria segurança 2026-08.
        return 403;
    }

    location /app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    # Link curto pra /liberar-acesso — a rota de verdade vive sob /app
    # (basePath do app técnico). https fixo de propósito: esta VM só escuta
    # na porta 80 (TLS é terminado antes, numa camada na frente — nginx -T
    # confirmado sem nenhum "listen 443" ativo aqui), mas o domínio público
    # SEMPRE é https pro usuário final; $scheme aqui sempre daria "http".
    location = /liberar-acesso {
        return 301 https://$host/app/liberar-acesso$is_args$args;
    }

    location ~ ^/painel-cdn/(.*)$ {
        proxy_pass http://127.0.0.1:3002/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/painel/(.+\.(?:png|jpg|jpeg|svg|gif|webp|ico|woff|woff2|ttf|otf|json|webmanifest|map|glb|gltf))$ {
        proxy_pass http://127.0.0.1:3002/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/painel/api/(.*)$ {
        proxy_pass http://127.0.0.1:3002/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    location /painel {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    location /postes {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # OTA do app técnico (capacitor-updater): manifest + bundles zip.
    location /ota/ {
        alias /data/vistomap/ota/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache";
        types {
            application/json json;
            application/zip  zip;
        }
        default_type application/octet-stream;
        client_max_body_size 200M;
    }

    # APK do app técnico pra download direto — ver comentário no
    # nginx-https.conf (mesmo bloco, fora do public/ do Next.js de propósito).
    location /downloads/ {
        alias /data/vistomap/downloads/;
        add_header Cache-Control "no-cache";
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        client_max_body_size 200M;
    }
}

# === gioc.nansen.com.br — GLPI ===
server {
    listen 80;
    server_name gioc.nansen.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }
}
