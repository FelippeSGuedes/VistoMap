# === vistomap.nansen.com.br — App técnico + Painel ===
server {
    listen 80;
    server_name vistomap.nansen.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    client_max_body_size 200M;

    location /uploads/ {
        alias /data/glpi/plugins/vistomapprojetos/uploads/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    location /files/ {
        alias /data/glpi/plugins/vistomapprojetos/files/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    location /app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    location ~ ^/painel-cdn/(.*)$ {
        proxy_pass http://127.0.0.1:3002/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/painel/(.+\.(?:png|jpg|jpeg|svg|gif|webp|ico|woff|woff2|ttf|otf|json|webmanifest|map))$ {
        proxy_pass http://127.0.0.1:3002/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/painel/api/(.*)$ {
        proxy_pass http://127.0.0.1:3002/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    location /painel {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    location /postes {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# === gioc.nansen.com.br — GLPI ===
server {
    listen 80;
    server_name gioc.nansen.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8088/gioc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /;
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }
}
