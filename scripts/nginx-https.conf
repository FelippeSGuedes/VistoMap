# === vistomap.nansen.com.br — HTTP redirect ===
server {
    listen 80;
    server_name vistomap.nansen.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# === gioc.nansen.com.br — HTTP redirect ===
server {
