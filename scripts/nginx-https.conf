# === vistomap.nansen.com.br — HTTPS App técnico + Painel ===
server {
    listen 443 ssl;
    server_name vistomap.nansen.com.br;

    ssl_certificate /etc/letsencrypt/live/vistomap.nansen.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vistomap.nansen.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200M;

    location /uploads/ {
        # Secret PRECISA bater com UPLOADS_SECURE_LINK_SECRET do .env.local
        # deployado — nunca commitar o valor real aqui (auditoria seg 2026-08:
        # antes disso, essa location servia qualquer arquivo pra qualquer um,
        # sem login, só sabendo/adivinhando o nome do equipamento).
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri CHANGE_ME_MATCH_ENV_SECRET";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        alias /data/glpi/plugins/vistomapprojetos/uploads/;
        add_header Cache-Control "private, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    location /files/ {
        # Sem consumidor legítimo (PDF vai por /api/painel/pdf, autenticado,
        # que lê o arquivo direto do disco) — fechado por completo em vez de
        # assinado, auditoria segurança 2026-08.
        return 403;
    }

    location /app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    location ~ ^/painel-cdn/(.*)$ {
        proxy_pass http://127.0.0.1:3002/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* ^/painel/(.+\.(?:png|jpg|jpeg|svg|gif|webp|ico|woff|woff2|ttf|otf|json|webmanifest|map))$ {
        proxy_pass http://127.0.0.1:3002/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/painel/api/(.*)$ {
        proxy_pass http://127.0.0.1:3002/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    location /painel {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    location /postes {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # OTA do app técnico (capacitor-updater): manifest + bundles zip.
    location /ota/ {
        alias /data/vistomap/ota/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache";
        types {
            application/json json;
            application/zip  zip;
        }
        default_type application/octet-stream;
        client_max_body_size 200M;
    }
}

# === gioc.nansen.com.br — HTTPS GLPI ===
