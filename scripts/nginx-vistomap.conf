    # === VistoMap App (tecnico) - basePath /app ===
    location /app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    # === VistoMap Painel _next assets (STRIP /painel) ===
    # Painel roda SEM basePath, entao standalone serve /_next na raiz.
    # Mas browser pede /painel/_next/* porque assetPrefix=/painel.
    # Nginx remove o /painel pros assets.
    location ~ ^/painel/_next/(.*)$ {
        proxy_pass http://127.0.0.1:3002/_next/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # === VistoMap Painel API (STRIP /painel) ===
    # Mesmo motivo: APIs estao na raiz /api do container painel.
    location ~ ^/painel/api/(.*)$ {
        proxy_pass http://127.0.0.1:3002/api/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    # === VistoMap Painel - rotas normais (MANTEM /painel) ===
    # Rota /painel/login bate com src/app/painel/login natural do Next.
    location /painel {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    # === Postes API - Fastify ===
    location /postes {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
