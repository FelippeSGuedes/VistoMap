    # === GLPI upload files (fotos e PDFs de vistorias) ===
    # Monta /uploads direto do host; sem proxy — servido estaticamente pelo nginx.
    # GLPI_UPLOAD_PATH=/uploads no container corresponde a este diretório no host.
    location /uploads/ {
        alias /var/www/html/glpi/plugins/vistomapprojetos/uploads/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    # === VistoMap App (tecnico) - basePath /app ===
    location /app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    # === VistoMap Painel Next chunks/assets (STRIP /painel-cdn) ===
    # Next 14 emite chunks com assetPrefix=/painel-cdn pra evitar bug onde
    # /painel prefix overlapping com rotas faz o router-server fazer
    # pathname.startsWith(assetPrefix) e stripar /painel das URLs de página.
    location ~ ^/painel-cdn/(.*)$ {
        proxy_pass http://127.0.0.1:3002/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # === VistoMap Painel static files (STRIP /painel) ===
    # asset() helper em src/utils/asset.ts ainda emite /painel/foo.png pra
    # imagens em public/. Container Next nao prefix-a public/ com assetPrefix,
    # entao nginx strip-a /painel pra esses pra bater com /foo.png no container.
    location ~ ^/painel/(.+\.(?:png|jpg|jpeg|svg|gif|webp|ico|woff|woff2|ttf|otf|json|webmanifest|map|glb|gltf))$ {
        proxy_pass http://127.0.0.1:3002/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # === VistoMap Painel API (STRIP /painel) ===
    location ~ ^/painel/api/(.*)$ {
        proxy_pass http://127.0.0.1:3002/api/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    # === VistoMap Painel - rotas (MANTEM /painel) ===
    location /painel {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    # === Postes API - Fastify ===
    location /postes {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
