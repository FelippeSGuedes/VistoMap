services:
  mariadb:
    image: mariadb:10.6
    container_name: vistomap-mariadb
    restart: unless-stopped
    # Só 127.0.0.1 — painel/técnico não dependem mais da porta publicada,
    # conectam via nome de serviço na rede Docker (vistomap_vistomap-net,
    # ver docker network connect). 127.0.0.1 fica só pra acesso via túnel
    # SSH de ferramentas administrativas (reset-db-password.sh etc.).
    # Auditoria segurança 2026-08: antes disso o banco de produção, com
    # senha real, ficava alcançável de qualquer interface (0.0.0.0).
    networks:
      - default
      - vistomap_vistomap-net
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: RootM@riaDB2026
      MYSQL_DATABASE: glpi_gioc
      MYSQL_USER: glpi_gioc
      MYSQL_PASSWORD: "!!N@n$$3n"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-mysql:
    image: mysql:8.0
    container_name: auth-mysql
    restart: unless-stopped
    # Nenhum consumidor encontrado no código pra este serviço — mesmo assim
    # fechado pra 127.0.0.1 (auditoria segurança 2026-08). Considerar
    # descomissionar se realmente não tiver uso.
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: RootMySQL2026
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: "Auth@2026#Prod"
    volumes:
      - auth-mysql-data:/var/lib/mysql

  glpi:
    image: vistomap-glpi:gioc
    container_name: vistomap-glpi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - /data/glpi:/var/www/html
      - /data/glpi-var:/var/lib/glpi_gioc
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb-data:
    name: vistomap_mariadb-data
  auth-mysql-data:
    name: vistomap_auth-mysql-data

networks:
  default: {}
  # Rede do projeto "vistomap" (painel/técnico, docker-compose.gioc.yml) —
  # precisa existir antes deste compose subir (`docker network create` já
  # aconteceu via aquele projeto). external:true porque não é dono da rede,
  # só entra nela.
  vistomap_vistomap-net:
    external: true
